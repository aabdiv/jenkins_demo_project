[project]
name = "demo-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.2",
    "uvicorn>=0.54.0",
    "langchain>=1.0.0"
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
extend-exclude = [".tools", ".uv-cache", ".pip-cache"]
